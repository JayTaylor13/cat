
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喵喵占卜 · 今日运势</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08061a;
            --c1: #e879f9;
            --c2: #c084fc;
            --c4: #f472b6;
            --gold: #fde68a;
            --text: #faf5ff;
            --muted: #a78bfa;
            --blush: #fbcfe8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(139, 92, 246, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 100%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(129, 140, 248, 0.1) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            overflow: hidden;
            padding: 20px;
        }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; border-radius: 50%; animation: tw var(--d) ease-in-out infinite var(--dl); }
        @keyframes tw { 0%,100% { opacity:.15; transform: scale(1); } 50% { opacity:1; transform: scale(1.5); } }

        .header { text-align: center; z-index: 2; margin-bottom: 10px; animation: fadeD 1s ease both; }
        .header h1 {
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            color: var(--text); letter-spacing: .12em;
            text-shadow: 0 0 40px rgba(255,105,180,.5), 0 0 80px rgba(255,182,204,.3);
        }
        .header p { font-family: 'Quicksand', sans-serif; font-size: .7rem; color: var(--muted); letter-spacing: .35em; margin-top: 6px; text-transform: uppercase; }
        @keyframes fadeD { from { opacity:0; transform: translateY(-16px); } to { opacity:1; transform: translateY(0); } }

        .scene { position: relative; z-index: 2; width: clamp(240px, 72vw, 360px); display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }

        .cat-wrap {
            width: 100%; display: flex; justify-content: center;
            animation: catBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 12px 30px rgba(255,105,180,.35));
        }
        @keyframes catBounce {
            0%,100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-2deg); }
            75% { transform: translateY(-4px) rotate(2deg); }
        }

        .ball-wrap { position: relative; margin-top: -30px; z-index: 3; display: flex; justify-content: center; }
        .ball {
            width: clamp(130px, 40vw, 180px); height: clamp(130px, 40vw, 180px);
            border-radius: 50%; cursor: pointer; position: absolute; left: 50%; top: 0;
            transform: translateX(-50%);
            transition: filter .3s; display: flex; align-items: center; justify-content: center;
        }
        .ball:hover { filter: brightness(1.2); }
        .ball.shaking { animation: ballShk .7s ease-in-out; }
        @keyframes ballShk {
            0%,100% { transform: translateX(-50%) rotate(0) scale(1); }
            12% { transform: translateX(-50%) rotate(-12deg) scale(1.1); }
            25% { transform: translateX(-50%) rotate(9deg) scale(1.06); }
            37% { transform: translateX(-50%) rotate(-8deg) scale(1.08); }
            50% { transform: translateX(-50%) rotate(6deg) scale(1.04); }
            62% { transform: translateX(-50%) rotate(-4deg) scale(1.03); }
            75% { transform: translateX(-50%) rotate(2deg) scale(1.01); }
        }
        .ball.glowing { animation: ballGl 2s ease-in-out infinite; }
        @keyframes ballGl { 0%,100% { filter: brightness(1) drop-shadow(0 0 20px rgba(255,105,180,.5)); } 50% { filter: brightness(1.3) drop-shadow(0 0 50px rgba(255,105,180,.9)); } }

        .ball-hint {
            position: absolute; bottom: -36px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(.72rem, 2.8vw, .85rem); color: var(--c4); letter-spacing: .08em;
            font-weight: 600; white-space: nowrap;
            animation: hintPulse 2.5s ease-in-out infinite;
        }
        @keyframes hintPulse { 0%,100% { opacity:.6; transform: translateX(-50%) translateY(0); } 50% { opacity:1; transform: translateX(-50%) translateY(-5px); } }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .p { position: absolute; border-radius: 50%; animation: pRise var(--d) ease-out forwards; }
        @keyframes pRise { 0% { opacity:0; transform: translateY(0) scale(0); } 15% { opacity:.9; } 90% { opacity:.1; } 100% { opacity:0; transform: translateY(-30vh) scale(1); } }

        .loading { display: none; align-items: center; gap: 8px; padding: 16px; z-index: 4; }
        .loading.show { display: flex; }
        .ld { width: 9px; height: 9px; border-radius: 50%; background: var(--c1); animation: ldB 1.2s ease-in-out infinite; }
        .ld:nth-child(2){animation-delay:.15s;}
        .ld:nth-child(3){animation-delay:.3s;}
        @keyframes ldB { 0%,80%,100%{transform:scale(.5);opacity:.3;} 40%{transform:scale(1.2);opacity:1;} }

        .card {
            display: none; flex-direction: column; align-items: center;
            background: linear-gradient(145deg, rgba(22,14,60,.97), rgba(14,9,40,.99));
            border: 1.5px solid rgba(232,121,249,.25); border-radius: 28px;
            padding: clamp(22px, 5vw, 34px) clamp(18px, 5vw, 30px);
            max-width: min(420px, 92vw); width: 100%;
            position: relative; overflow: hidden; z-index: 2;
            box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 50px rgba(232,121,249,.12), inset 0 1px 0 rgba(255,255,255,.07);
            animation: cardIn .7s cubic-bezier(.34,1.56,.64,1) both; margin-top: 4px;
        }
        .card.show { display: flex; }
        @keyframes cardIn { from{opacity:0;transform:scale(.75) translateY(40px);} to{opacity:1;transform:scale(1) translateY(0);} }
        .card::before { content:''; position: absolute; top:0; left:0; right:0; height:1px; background: linear-gradient(90deg,transparent,rgba(232,121,249,.5),transparent); }
        .c-orb { position: absolute; top:-40px; right:-40px; width:130px; height:130px; border-radius: 50%; background: radial-gradient(circle,rgba(232,121,249,.12) 0%,transparent 70%); pointer-events: none; }
        .rank-badge { font-family: 'Quicksand', sans-serif; font-size: .65rem; font-weight: 700; letter-spacing: .3em; padding: 4px 18px; border-radius: 20px; border: 1px solid; margin-bottom: 14px; }
        .badge-super { background:rgba(253,230,138,.12); color:#fde68a; border-color:rgba(253,230,138,.4); }
        .badge-good { background:rgba(232,121,249,.12); color:#e879f9; border-color:rgba(232,121,249,.4); }
        .badge-normal { background:rgba(244,114,182,.12); color:#f472b6; border-color:rgba(244,114,182,.4); }
        .badge-bad { background:rgba(248,113,113,.12); color:#f87171; border-color:rgba(248,113,113,.4); }
        .date-str { font-family: 'Quicksand', sans-serif; font-size: .7rem; color: var(--muted); letter-spacing: .1em; margin-bottom: 12px; }
        .overall { font-size: clamp(1.2rem, 4.5vw, 1.6rem); color: var(--text); text-align: center; line-height: 1.5; letter-spacing: .05em; margin-bottom: 16px; }
        .divider { width: 50px; height: 2px; background: linear-gradient(90deg,var(--c1),var(--c4)); border-radius: 2px; margin: 0 auto 16px; }
        .items { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .item { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.055); border-radius: 14px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; }
        .il { font-family: 'Quicksand', sans-serif; font-size: .62rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
        .iv { font-size: clamp(.88rem, 3vw, 1rem); color: var(--text); font-weight: 700; }
        .quote { width: 100%; background: rgba(232,121,249,.055); border-left: 3px solid var(--c1); border-radius: 0 10px 10px 0; padding: 11px 15px; margin-bottom: 18px; font-size: clamp(.82rem, 2.8vw, .93rem); color: var(--blush); line-height: 1.75; font-style: italic; }
        .replay { display: flex; align-items: center; gap: 8px; padding: 11px 26px; background: linear-gradient(135deg, rgba(232,121,249,.18), rgba(244,114,182,.18)); border: 1.5px solid rgba(232,121,249,.35); border-radius: 30px; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: .82rem; font-weight: 600; letter-spacing: .1em; cursor: pointer; transition: all .3s; }
        .replay:hover { background: linear-gradient(135deg, rgba(232,121,249,.32), rgba(244,114,182,.32)); border-color: rgba(232,121,249,.65); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,121,249,.22); }
        .share-tip { margin-top: 10px; font-family: 'Quicksand', sans-serif; font-size: .62rem; color: var(--muted); opacity: .55; }
        .scene.dimmed { opacity: .3; filter: blur(4px); transition: all .5s; }
        .header.hidden { display: none; }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="header" id="header">
    <h1>喵喵占卜</h1>
    <p>Fortune Telling by Cat</p>
</div>

<div class="scene" id="scene">

    <!-- Chibi Cat — Lo Xiao Hei style (round, chubby, big eyes) -->

        <svg width="clamp(160px, 46vw, 220px)" height="clamp(160px, 46vw, 220px)" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">

            <path d="M165 170 Q200 150 195 120 Q192 100 175 105 Q158 112 160 130 Q162 145 165 155" stroke="#ffb3cc" stroke-width="16" fill="none" stroke-linecap="round">

    </div>

    <!-- Crystal Ball -->
    <div class="ball-wrap" style="margin-top: -10px;">
        <div class="ball" id="ball" onclick="draw()">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

        <div class="ball-hint" id="hint">请娇娇陛下抽取今日运势</div>

<div class="loading" id="loading"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

    let pool = [];
    let busy = false;

    function getFortune() {
        if (pool.length === 0) {
            pool = [...allFortunes];
            // Fisher-Yates shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
        }
        return pool.pop();
    }

    function draw() {
        if (busy) return;
        busy = true;
        const ball = document.getElementById('ball');
        const hint = document.getElementById('hint');
        const load = document.getElementById('loading');
        const scene = document.getElementById('scene');
        const hdr = document.getElementById('header');
        hint.style.display = 'none';
        ball.classList.add('shaking');
        load.classList.add('show');
        emitP(40);
        setTimeout(() => {
            ball.classList.remove('shaking');
            ball.classList.add('glowing');
            load.classList.remove('show');
            scene.classList.add('dimmed');
            hdr.classList.add('hidden');
            const f = getFortune();
            showC(f);
            busy = false;
        }, 2200);
    }

    function showC(f) {
        const d = new Date();
        const ds = `${d.getMonth()+1}月${d.getDate()}日 · ${['日','一','二','三','四','五','六'][d.getDay()]}`;
        const card = document.getElementById('card');
        card.innerHTML = `
            <div class="c-orb"></div>
            <div class="rank-badge ${f.rank}">${f.rText}</div>
            <div class="date-str">${ds} · 今日运势</div>
            <div class="overall">${f.overall}</div>
            <div class="divider"></div>
            <div class="items">
                <div class="item"><div class="il">💕 爱情</div><div class="iv">${f.love}</div></div>
                <div class="item"><div class="il">💼 事业</div><div class="iv">${f.career}</div></div>
                <div class="item"><div class="il">🧭 方位</div><div class="iv">${f.dir}</div></div>
                <div class="item"><div class="il">🔢 数字</div><div class="iv">${f.num}</div></div>
                <div class="item" style="grid-column:span 2"><div class="il">🌈 幸运色</div><div class="iv">${f.col}</div></div>
            </div>
            <div class="quote">${f.quote}</div>
            <button class="replay" onclick="reset()"><span>🔮</span> 再抽一次</button>
            <div class="share-tip">长按运势卡 · 发送给亲爱的TA</div>
        `;
        card.classList.add('show');
    }

    function reset() {
        const card = document.getElementById('card');
        const ball = document.getElementById('ball');
        const hint = document.getElementById('hint');
        const scene = document.getElementById('scene');
        const hdr = document.getElementById('header');
        card.classList.remove('show');
        ball.classList.remove('glowing');
        hint.style.display = '';
        scene.classList.remove('dimmed');
        hdr.classList.remove('hidden');
        card.innerHTML = '';
    }

    function emitP(n) {
        const ct = document.getElementById('particles');
        const cols = ['#e879f9','#c084fc','#f472b6','#fde68a','#818cf8','#fb7185'];
        for (let i = 0; i < n; i++) {
            setTimeout(() => {
                const p = document.createElement('div');
                p.className = 'p';
                const sz = Math.random() * 7 + 3;
                const c = cols[Math.floor(Math.random()*cols.length)];
                p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:35%;background:${c};box-shadow:0 0 ${sz*2}px ${c};--d:${Math.random()*3+3}s;`;
                ct.appendChild(p);
                requestAnimationFrame(() => p.classList.add('p'));
                setTimeout(() => p.remove(), 6000);
            }, i * 40);
        }
    }
</script>
